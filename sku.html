<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>SKU Generator</title>
</head>

<body>
    <nav>
        <a href="sku.html">SKU Generator</a>
        <a href="index.html">Receipt Generator</a>
    </nav>
    
    <main>
        <div class="sku-box">
            <div class="sku-header">
                <h2>SKU Generator</h2>
            </div>
            
            <div class="sku-content">
                <label for="category">Category</label>
                <select id="category">
                    <option value="BEV">Beverage</option>
                    <option value="DRK">Matcha</option>
                    <option value="YUZ">Fruit Drink</option>
                    <option value="CHO">Chocolate</option>
                    <option value="FRA">Frappucino</option>
                </select>


                <label for="product_name">Product Name</label>
                <select id="product_name">
                    <option value="Matcha Ichigo">
                        Matcha Ichigo
                    </option>
                    <option value="Dark Matcha">
                        Dark Matcha
                    </option>
                    <option value="Cold Strawberry Yuzu">
                        Cold Strawberry Yuzu
                    </option>
                    <option value="Mint Peppermint Chocolate">
                        Mint Peppermint Chocolate
                    </option>
                    <option value="White Caramel Frappucino">
                        White Caramel Frappucino
                    </option>
                </select>
                
                <label for="stock_quantity">
                    Stock Quantity
                </label>
                <input type="number" id="stock_quantity" placeholder="e.g. 50">
                
                <button type="button" py-click="generate_sku">Generate SKU</button>


                <!-- shows the SKU -->
                <h3 id="sku-output">---</h3> 

            </div>

        </div>

    </main>


    <footer>
        SKU GENERATOR • ICT10 1st Quarter Project
    </footer>
    <script type="py" src="main.py"></script>

</body>
</html>
