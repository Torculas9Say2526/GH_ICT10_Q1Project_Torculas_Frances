        <div class="container">

                <legend>Order Here</legend>

                <div class="menu-item">

                    <input type="checkbox" id="item3" value="145">

                <button type="button" py-click="create_order">
                    Create Order

            <section class="receipt">
                <h2>Receipt</h2>
